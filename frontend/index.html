<html>

    <script type="module" src="play2.js"></script>

    <body>
        Welcome to Social Inference!
        <div id="partition-info">
            <h2>Current Partition: <span id="current-partition"></span></h2>
            <h2><span id="error-display"></span></h2>
        </div>
        <div id="chat-container"> 
            <div id="chat-output" style="margin-top: 10px; padding: 10px; border: 1px solid #ddd; border-radius: 4px; background: #f9f9f9; font-family: monospace; white-space: pre-wrap;"></div>

            <input id="chat-input" type="text" placeholder="Enter your message here...">
            <button id="chat-button" >Send</button>
        </div>
        <div id="sessions-container">
            <!-- Sessions will be dynamically added here -->
        </div>
        <div id="console">
            <!-- Hooked console messages will be displayed here -->
        </div>
        <div id="profiling">
            <!-- Profiling will be displayed here -->
        </div>
    </body>
</html>
